name: docs-consistency

on:
  push:
    branches: [wika-fundaments-v2, main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate documentation consistency
        run: python3 scripts/validate_docs.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate project fixture (gold)
        run: python3 scripts/validate_project.py --project tests/fixtures/sample-project/gold
