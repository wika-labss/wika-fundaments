<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vissiuss — acceso admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0B1220;
      --card: #172033;
      --ink: #F4F7FB;
      --muted: #93A0B5;
      --line: #2A3548;
      --accent: #C9A227;
      --accent-dark: #A6861C;
      --brand: #E8D48B;
      --danger: #C2413B;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(201, 162, 39, 0.16), transparent 50%),
        linear-gradient(180deg, #0B1220 0%, #121A2B 100%);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
    }
    .card {
      width: min(420px, calc(100vw - 32px));
      background: var(--card);
      border: 1px solid var(--line);
      padding: 36px 32px 28px;
    }
    .brand {
      font-family: "Cormorant Garamond", Georgia, serif;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: 22px;
      color: var(--brand);
      margin: 0 0 6px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 600;
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
    label {
      display: block;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 6px;
    }
    input {
      width: 100%;
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: #0B1220;
      color: var(--ink);
      font: inherit;
    }
    input:focus { outline: 1px solid var(--accent); }
    button {
      width: 100%;
      margin-top: 8px;
      padding: 12px 16px;
      border: 0;
      background: var(--accent);
      color: #0B1220;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
    }
    button:hover { background: var(--accent-dark); color: var(--ink); }
    .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 12px; }
  </style>
</head>
<body>
  <form class="card" id="login-form">
    <p class="brand">Vissiuss</p>
    <h1>Admin Scraping TA</h1>
    <p>Consola empresarial para auditar la vista cliente de PedidosYa, Uber Eats, Rappi y Justo.</p>
    <label for="username">Usuario</label>
    <input id="username" name="username" autocomplete="username" required />
    <label for="password">Clave</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit">Entrar al admin</button>
    <p class="err" id="error"></p>
  </form>
  <script>
    document.getElementById("login-form").onsubmit = async (ev) => {
      ev.preventDefault();
      const error = document.getElementById("error");
      error.textContent = "";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "No se pudo entrar.");
        window.location.href = "/admin";
      } catch (err) {
        error.textContent = String(err.message || err);
      }
    };
  </script>
</body>
</html>
